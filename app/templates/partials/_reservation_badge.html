{# Reservation status badge. Expects `status` (a ReservationStatus member). #}
{%- set _icons = {"confirmed": "check2", "completed": "check2-all", "no_show": "person-x", "cancelled": "x-lg"} -%}
<span class="qj-status qj-status--{{ 'reserved' if status.value == 'confirmed' else status.value }} badge"><i class="bi bi-{{ _icons.get(status.value, 'circle') }}" aria-hidden="true"></i>{{ status.value.replace("_", " ") }}</span>
