<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>My account - Quick Junction</title>
</head>
<body>
  <h1>Logged in as {{ user.username }}</h1>
  <p>Role: {{ user.role.value }}</p>
  <p><a href="{{ url_for('menu.index') }}">Menu</a> | <a href="{{ url_for('cart.index') }}">Cart</a> | <a href="{{ url_for('orders.history') }}">My orders</a></p>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <p class="flash flash-{{ category }}">{{ message }}</p>
    {% endfor %}
  {% endwith %}

  <form method="post" action="{{ url_for('auth.logout') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button type="submit">Log out</button>
  </form>
</body>
</html>
