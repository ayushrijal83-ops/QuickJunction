# Quick Junction CI (M0 baseline).
#
# Jobs:
#   test-sqlite      full suite on the default in-memory SQLite (725 collected).
#   test-mysql       full suite on a disposable MySQL 8.0 service, so the fifteen
#                    real-concurrency tests in tests/test_mysql_concurrency.py
#                    execute instead of skipping, then a guard that fails the job
#                    if any of those fifteen is skipped. Update this count (here
#                    and in the guard step below) whenever a test is added to or
#                    removed from that file -- M7.5.2/M7.5.3 added two without
#                    updating it once; M7.5.4 added one more; M7.5.4.4 added one
#                    more still; M7.5.4.7 retired app/services/payments.py and
#                    removed the two concurrency tests that exclusively covered
#                    its own now-nonexistent business rules (seventeen -> fifteen).
#   test-redis       the rate-limiter tests on a disposable Redis service, so the
#                    Lua sliding window in app/utils/ratelimit.py runs against a
#                    real server (tests/test_ratelimit_redis.py skips without
#                    TEST_REDIS_URL), with a guard that fails the job unless
#                    exactly 14 Redis tests ran and passed. The other two jobs run the same
#                    files with no Redis: the in-memory path.
#   dependency-audit pip-audit. Blocking for the runtime environment
#                    (requirements.txt, resolved and installed); report-only for
#                    the optional AI stack (requirements-ai.txt) -- see
#                    docs/STATUS.md "Dependency audit" for why.
#
# Python 3.11 is the production baseline. The AI stack and models/ (git-ignored)
# are not installed here; the tests that need models/ skip themselves.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  test-sqlite:
    name: Tests (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run test suite
        run: python -m pytest -rs

  test-mysql:
    name: Tests (MySQL 8.0)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.0
        env:
          # Throwaway credentials for a container that lives only for this job.
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: quickjunction_test
          MYSQL_USER: qj_test
          MYSQL_PASSWORD: ci-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      # tests/conftest.py refuses any database whose name does not end in _test.
      TEST_DATABASE_URL: mysql+pymysql://qj_test:ci-test-password@127.0.0.1:3306/quickjunction_test?charset=utf8mb4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Wait for MySQL to accept the application account
        run: |
          for _ in $(seq 1 60); do
            python -c "import pymysql; pymysql.connect(host='127.0.0.1', port=3306, user='qj_test', password='ci-test-password', database='quickjunction_test').close()" && exit 0
            sleep 2
          done
          echo "MySQL did not become ready" >&2
          exit 1
      - name: Run test suite
        run: python -m pytest -rs
      - name: Guard - MySQL concurrency tests must execute, not skip
        run: |
          python -m pytest tests/test_mysql_concurrency.py -o addopts="" -q -rs | tee concurrency.txt
          if grep -qi "skipped" concurrency.txt; then
            echo "::error::MySQL concurrency tests were skipped; TEST_DATABASE_URL is not reaching MySQL." >&2
            exit 1
          fi
          grep -Eq "^15 passed" concurrency.txt || { echo "::error::expected 15 passed concurrency tests" >&2; exit 1; }

  test-redis:
    name: Tests (Redis rate limiter)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      # A throwaway server that lives only for this job. The tests write under
      # their own random key prefix and delete only those keys.
      TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run in-memory rate-limiter tests
        run: python -m pytest tests/test_ratelimit.py -o addopts="" -q -rs
      - name: Run Redis rate-limiter tests and require all 14 to pass
        run: |
          set -o pipefail
          python -m pytest tests/test_ratelimit_redis.py -o addopts="" -q -rs | tee ratelimit_redis.txt
          # The summary is exactly "14 passed in <t>s" only when all 14 ran and
          # passed: any skip, failure, error or count change alters this line.
          grep -Eq "^14 passed in " ratelimit_redis.txt || { echo "::error::expected exactly 14 passed Redis rate-limiter tests (none skipped); is TEST_REDIS_URL reaching Redis?" >&2; exit 1; }

  dependency-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pip-audit
        run: python -m pip install pip-audit
      - name: Audit runtime requirements (blocking)
        # Resolves requirements.txt in an isolated environment, so the
        # transitive packages it does not pin (Werkzeug, Jinja2, ...) are
        # audited too -- but the runner's own pip/setuptools are not, since
        # they are tooling rather than something the application ships with.
        run: pip-audit --progress-spinner off -r requirements.txt
      - name: Audit optional AI stack (report-only)
        # requirements-ai.txt is not part of the pilot deployment (the LLM is
        # optional and will be disabled by default in production, Phase 1).
        # Known advisories against its pins are tracked in docs/STATUS.md;
        # fixing them needs transformers 5.x, which the current peft pin
        # cannot load. Reported, not blocking, until that stack is revisited.
        continue-on-error: true
        run: pip-audit --progress-spinner off -r requirements-ai.txt --no-deps
